<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밥돌이 조작부 제안안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Outfit:wght@600&display=swap">
<style>
/* Layout: the 150x45 panel is the page's one large object; live status sits under it, then the reasoning and build spec. */
:root {
  --bg: #f1f0ee; --surface: #ffffff; --fg: #181615; --muted: #5d5855; --line: #d8d4cf;
  --accent: #c8102e; --flash: #ffe3e6; --chip: #e9e6e2;
  --p-body: #231f20; --p-edge: #231f20; --p-glass: #3a3839; --p-ink: #ffffff; --p-red: #ff1e2d;
  --p-seg-off: #2c2423; --p-green: #19c455; --p-led-off: #4a4a4c; --p-stg-off: #2e2e30; --p-led: #ed1c2e; --p-dim: #8f8f92; --p-key-down: #333130;
  --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121110; --surface: #1c1a19; --fg: #eceae7; --muted: #a6a09b; --line: #353230;
  --accent: #ff5c6c; --flash: #4a1a20; --chip: #2a2726; --p-edge: #3d3a38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121110; --surface: #1c1a19; --fg: #eceae7; --muted: #a6a09b; --line: #353230;
  --accent: #ff5c6c; --flash: #4a1a20; --chip: #2a2726; --p-edge: #3d3a38; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
p { margin: 0; }
.sub { color: var(--muted); max-width: 70ch; }
.panel-scroll { overflow-x: auto; }
#panel { display: block; width: 100%; min-width: 620px; height: auto; user-select: none; -webkit-user-select: none; }
#panel text { font-family: 'Outfit', var(--sans); font-weight: 600; fill: var(--p-ink); pointer-events: none; }
.key { cursor: pointer; outline: none; touch-action: none; }
.key .face { fill: transparent; stroke: var(--p-ink); stroke-width: 2; }
#k-power .face { fill: var(--p-led); stroke: var(--p-led); }
#k-power.down .face { fill: #a50f1e; }
#k-power .face, #k-power.down .face { stroke-width: 2; }
.key.down .face { fill: var(--p-key-down); }
.key:focus-visible .face { stroke: #ffd24a; stroke-width: 7; }
.seg { fill: var(--p-seg-off); } .seg.on { fill: var(--p-red); }
.stg { fill: var(--p-stg-off); } .stg.on { fill: var(--p-green); }
.led { fill: var(--p-led-off); } .led.on { fill: var(--p-led); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
dl { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
dt { color: var(--muted); font-size: 13px; }
dd { margin: 0; font-family: var(--mono); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--chip); font-weight: 500; }
#buz { display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); }
#buz .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
#buz.on { background: var(--flash); border-color: var(--accent); color: var(--accent); font-weight: 500; }
#buz.on .dot { background: var(--accent); }
.bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ctl label { display: inline-flex; align-items: center; gap: 6px; }
.seggrp { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seggrp label { padding: 5px 12px; cursor: pointer; }
.seggrp input { position: absolute; opacity: 0; pointer-events: none; }
.seggrp label:has(input:checked) { background: var(--fg); color: var(--bg); }
.seggrp label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
button.plain { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.plain:hover { border-color: var(--fg); }
button.plain:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { color: var(--muted); font-size: 13px; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
td.mono, #log { font-family: var(--mono); font-size: 13px; }
tr.sel td { background: var(--chip); }
#log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 232px; overflow-y: auto; }
#log li { overflow-wrap: anywhere; }
html, body { margin: 0; }
a.manual { display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 500; }
a.manual:hover { border-color: var(--fg); }
[hidden] { display: none !important; }
</style>
</head>

<script>
(function () {
  'use strict';
  var S = { OFF: 'S0', READY: 'S1', COOK: 'S2', PAUSE: 'S3', DONE: 'S4', EDIT: 'S5', ERR: 'S6', RST: 'S7' };
  var NAME = { S0: '전원 꺼짐', S1: '대기', S2: '취사 중', S3: '일시정지', S4: '완료', S5: '저장 모드', S6: '용기 없음 E0', S7: '출고 복원 확인' };
  var KN = { m0: '메뉴 1', m1: '메뉴 2', m2: '메뉴 3', m3: '메뉴 4', start: '시작', power: '전원', plus: '증가', minus: '감소' };
  var MAP = { '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg', '5': 'acdfg', '6': 'acdefg', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', 'P': 'abefg', 'E': 'adefg', 'n': 'ceg', 'd': 'bcdeg', 'r': 'eg', 'S': 'acdfg', 't': 'defg', '-': 'g', ' ': '' };
  var PAT = { click: [60], start: [150, 80, 300], pause: [120, 80, 120], cancel: [600], save: [120, 80, 120, 80, 400], done: [400, 200, 400, 200, 400], err: [100, 100, 100, 100, 100], remind: [80, 120, 80] };
  var BN = { click: '입력음', start: '시작음 (짧게, 길게)', pause: '일시정지음 (짧게 2회)', cancel: '취소음 (길게 1회)', save: '저장음 (짧게 2회, 길게)', done: '완료음 (3회)', err: '에러음 (빠르게 3회)', remind: '알림음 (짧게 2회)' };
  var IDLE_MS = 600000, EDIT_MS = 30000, RST_MS = 5000, POT_MS = 60000;

  function defaults() {
    var out = [];
    for (var i = 0; i < 4; i++) out.push([{ t: 420, p: 7 }, { t: 180, p: 7 }, { t: 0, p: 0 }, { t: 0, p: 0 }]);
    return out;
  }
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem('bapdori-proposal-v1') || 'null');
      if (o && o.mems && o.mems.length === 4) return o;
    } catch (e) {}
    return { mems: defaults(), sel: 0 };
  }
  function persist() { try { localStorage.setItem('bapdori-proposal-v1', JSON.stringify({ mems: mems, sel: sel })); } catch (e) {} }

  var saved = load();
  var mems = saved.mems, sel = saved.sel || 0;
  var st = S.OFF, remain = 0, draft = null, item = 0, editM = 0, idleMs = 0, auxMs = 0, auxN = 0, errFrom = S.READY;
  var pot = true, speed = 1, soundOn = true, held = null, logs = [];

  function $(id) { return document.getElementById(id); }
  function used(m) { var n = 0; while (n < 4 && m[n].t > 0) n++; return n; }
  function total(m) { var n = used(m), s = 0; for (var i = 0; i < n; i++) s += m[i].t; return s; }
  function stageAt(m, rem) { var n = used(m), el = total(m) - rem, acc = 0; for (var i = 0; i < n; i++) { acc += m[i].t; if (el < acc) return i; } return Math.max(0, n - 1); }
  function locked(i) { for (var j = 0; j < i; j++) { if (draft[j].t === 0) return true; } return false; }
  function p2(v) { return (v < 10 ? '0' : '') + v; }
  function fmt(sec) { return p2(Math.floor(sec / 60)) + p2(sec % 60); }
  function clock(sec) { return Math.floor(sec / 60) + ':' + p2(sec % 60); }
  function curItem() { return { k: item % 2 === 0 ? 't' : 'p', i: Math.floor(item / 2) }; }

  /* ---------- buzzer ---------- */
  var ac = null, gain = null, buzTimers = [], buzOn = false, buzName = '';
  function audioInit() {
    if (ac) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();
      var osc = ac.createOscillator(); osc.type = 'square'; osc.frequency.value = 2400;
      gain = ac.createGain(); gain.gain.value = 0;
      osc.connect(gain); gain.connect(ac.destination); osc.start();
    } catch (e) { ac = null; }
  }
  function tone(on) {
    buzOn = on;
    if (ac && gain) { try { if (ac.state === 'suspended') ac.resume(); gain.gain.setTargetAtTime(on && soundOn ? 0.05 : 0, ac.currentTime, 0.004); } catch (e) {} }
  }
  function buzzStop() { buzTimers.forEach(clearTimeout); buzTimers = []; tone(false); buzName = ''; }
  function buzz(kind) {
    buzzStop();
    var pat = PAT[kind], t = 0;
    buzName = BN[kind]; tone(true);
    for (var i = 0; i < pat.length; i++) {
      t += pat[i];
      (function (on) { buzTimers.push(setTimeout(function () { tone(on); }, t)); })(i % 2 === 1);
    }
    buzTimers.push(setTimeout(function () { tone(false); buzName = ''; }, t + 20));
  }

  /* ---------- log and transitions ---------- */
  function stamp() { var d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
  function log(msg) {
    logs.unshift(stamp() + '  ' + msg); if (logs.length > 30) logs.pop();
    var ul = $('log'); if (!ul) return; ul.textContent = '';
    logs.forEach(function (l) { var li = document.createElement('li'); li.textContent = l; ul.appendChild(li); });
  }
  function setLast(t) { }
  function go(to, input, sound) {
    var from = st; st = to; idleMs = 0; auxMs = 0; auxN = 0;
    if (to !== S.EDIT) draft = null;
    if (sound) buzz(sound); else if (to === S.OFF) buzzStop();
    setLast(input);
    log(from + ' → ' + to + ' ' + NAME[to] + '  |  ' + input + (sound ? '  |  ' + BN[sound] : ''));
    renderMem();
  }
  function noResp(key) { setLast(KN[key] + ' → 무반응'); }

  /* ---------- inputs ---------- */
  function longAction(key) {
    var isM = key.charAt(0) === 'm' && key.length === 2;
    if (isM && st === S.READY) {
      var n = Number(key.charAt(1));
      return { ms: 2000, fn: function () {
        editM = n; sel = n; persist();
        draft = mems[n].map(function (x) { return { t: x.t, p: x.p }; }); item = 0;
        go(S.EDIT, KN[key] + ' 2초 누름', 'click');
      } };
    }
    if (key === 'start' && st === S.PAUSE) return { ms: 2000, fn: function () { go(S.READY, '시작 2초 누름 (취사 취소)', 'cancel'); } };
    if (key === 'start' && st === S.OFF) return { ms: 5000, fn: function () { go(S.RST, '시작 5초 누름 (출고 복원 확인)', 'click'); } };
    if (key === 'power' && (st === S.COOK || st === S.PAUSE || st === S.ERR)) return { ms: 2000, fn: function () { go(S.OFF, '전원 2초 누름', 'click'); } };
    return null;
  }
  function saveDraft() {
    var cut = false;
    for (var i = 1; i < 4; i++) { if (draft[i - 1].t === 0) cut = true; if (cut || draft[i].t === 0) { draft[i].t = 0; draft[i].p = 0; } }
    mems[editM] = draft; persist();
  }
  function shortAction(key) {
    var isM = key.charAt(0) === 'm' && key.length === 2, n = isM ? Number(key.charAt(1)) : -1;
    if (st === S.OFF) { if (key === 'power') go(S.READY, '전원', 'click'); return; }
    if (st === S.RST) {
      if (key === 'start') { mems = defaults(); persist(); go(S.OFF, '시작 (출고 레시피 복원)', 'save'); }
      else go(S.OFF, KN[key] + ' (복원 취소)', 'cancel');
      return;
    }
    if (st === S.READY) {
      if (isM) { sel = n; persist(); buzz('click'); setLast(KN[key] + ' 선택'); log('S1 ' + KN[key] + ' 선택'); renderMem(); }
      else if (key === 'start') {
        if (pot) { remain = total(mems[sel]); go(S.COOK, '시작', 'start'); }
        else { errFrom = S.READY; go(S.ERR, '시작 (용기 없음)', 'err'); }
      }
      else if (key === 'power') go(S.OFF, '전원', 'click');
      else noResp(key);
      return;
    }
    if (st === S.COOK) { if (key === 'start') go(S.PAUSE, '시작 (일시정지)', 'pause'); else noResp(key); return; }
    if (st === S.PAUSE) {
      if (key === 'start') go(S.COOK, '시작 (재개)', 'start');
      else if (isM) { sel = n; persist(); go(S.READY, KN[key] + ' 선택 (취사 취소)', 'cancel'); }
      else noResp(key);
      return;
    }
    if (st === S.DONE) {
      if (key === 'start') go(S.READY, '시작', 'click');
      else if (isM) { sel = n; persist(); go(S.READY, KN[key] + ' 선택', 'click'); }
      else if (key === 'power') go(S.OFF, '전원', 'click');
      else noResp(key);
      return;
    }
    if (st === S.EDIT) {
      if (isM && n === editM) { item = (item + 1) % 8; auxMs = 0; buzz('click'); setLast(KN[key] + ' (다음 항목)'); }
      else if (key === 'start') { saveDraft(); go(S.READY, '시작 (저장)', 'save'); }
      else if (key === 'power') go(S.READY, '전원 (저장 안 하고 나가기)', 'cancel');
      else noResp(key);
      return;
    }
    if (st === S.ERR) { noResp(key); }
  }
  function adjust(key, isLong) {
    if (st !== S.EDIT) return;
    var it = curItem(), d = key === 'plus' ? 1 : -1, row = draft[it.i];
    auxMs = 0;
    if (locked(it.i)) { setLast(KN[key] + ' → 조정 불가 (앞 단계의 시간이 0)'); return; }
    if (it.k === 't') row.t = Math.max(it.i === 0 ? 10 : 0, Math.min(1200, row.t + d * (isLong ? 60 : 10)));
    else row.p = Math.max(it.i === 0 ? 1 : 0, Math.min(10, row.p + d));
    if (!isLong) buzz('click');
    setLast(KN[key] + (isLong ? ' 길게' : ' 짧게'));
  }
  function press(key, el) {
    if (held) return;
    audioInit(); idleMs = 0; if (st === S.EDIT) auxMs = 0;
    held = { key: key, el: el, t0: performance.now(), done: false, isLong: false, ms: 0, timers: [] };
    el.classList.add('down');
    if (key === 'plus' || key === 'minus') {
      held.done = true;
      if (st !== S.EDIT) { if (st !== S.OFF) noResp(key); return; }
      adjust(key, false);
      held.timers.push(setTimeout(function () {
        if (!held || st !== S.EDIT) return;
        adjust(key, true);
        held.rep = setInterval(function () { adjust(key, true); }, curItem().k === 't' ? 200 : 300);
      }, 1000));
      return;
    }
    var la = longAction(key);
    if (la) {
      held.isLong = true; held.ms = la.ms;
      held.timers.push(setTimeout(function () { if (held) { held.done = true; la.fn(); } }, la.ms));
    }
  }
  function release() {
    if (!held) return;
    var h = held; held = null;
    h.timers.forEach(clearTimeout); if (h.rep) clearInterval(h.rep);
    h.el.classList.remove('down');
    idleMs = 0; if (st === S.EDIT) auxMs = 0;
    if (!h.done) shortAction(h.key);
  }

  /* ---------- build the panel ---------- */
  function buildPanel() {
    var m = '', i, x, y;
    for (i = 0; i < 4; i++) {
      x = 299 + (i % 2) * 139; y = 64 + Math.floor(i / 2) * 135;
      m += '<g class="key" id="k-m' + i + '" data-key="m' + i + '" role="button" tabindex="0" aria-label="메뉴 ' + (i + 1) + '">' +
        '<rect class="face" x="' + x + '" y="' + y + '" width="88" height="85" rx="16"></rect>' +
        '<rect x="' + (x + 6) + '" y="' + (y + 6) + '" width="76" height="73" rx="11" fill="none" stroke="var(--p-ink)" stroke-width="1.2" pointer-events="none"></rect>' +
        '<text x="' + (x + 44) + '" y="' + (y + 56) + '" font-size="40" text-anchor="middle">' + (i + 1) + '</text></g>' +
        '<rect id="ml' + i + '" class="led" x="' + (x + 16) + '" y="' + (y - 25) + '" width="56" height="11" rx="5.5" pointer-events="none"></rect>';
    }
    $('mems').innerHTML = m;
    var segs = [['a', 9, 0, 44, 12], ['b', 50, 8, 12, 44], ['c', 50, 62, 12, 44], ['d', 9, 102, 44, 12], ['e', 0, 62, 12, 44], ['f', 0, 8, 12, 44], ['g', 9, 51, 44, 12]];
    var dx = [645, 723, 801, 879], d = '';
    for (i = 0; i < 4; i++) {
      d += '<g transform="translate(' + dx[i] + ',86) scale(0.78) skewX(-4)">';
      segs.forEach(function (s) { d += '<rect class="seg" id="d' + i + s[0] + '" x="' + s[1] + '" y="' + s[2] + '" width="' + s[3] + '" height="' + s[4] + '" rx="5"></rect>'; });
      d += '<circle class="seg" id="dp' + i + '" cx="76" cy="110" r="6"></circle></g>';
    }
    $('digits').innerHTML = d;
    var s = '';
    for (i = 0; i < 4; i++) s += '<rect class="stg" id="sg' + i + '" x="' + (618 + i * 91.5) + '" y="231" width="66" height="15" rx="7.5"></rect>' +
      '<text x="' + (651 + i * 91.5) + '" y="272" font-size="18" text-anchor="middle" style="font-weight:400" fill="var(--p-ink)">' + (i + 1) + '단계</text>';
    $('stages').innerHTML = s;
    Array.prototype.forEach.call(document.querySelectorAll('#panel .key'), function (el) {
      var key = el.getAttribute('data-key');
      el.addEventListener('pointerdown', function (e) { e.preventDefault(); press(key, el); });
      el.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(key, el); } });
      el.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') release(); });
      el.addEventListener('blur', release);
      el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
  }

  /* ---------- render ---------- */
  function setOn(id, on) { var el = $(id); if (el) el.classList.toggle('on', !!on); }
  function render() {
    var now = performance.now(), b1 = Math.floor(now / 500) % 2 === 0, b2 = Math.floor(now / 250) % 2 === 0;
    var txt = '    ', colon = false, dOn = true, stg = [0, 0, 0, 0], memOn = -1, memVis = true, m = mems[sel], i, n = used(m), heat = '꺼짐';
    if (st === S.READY) { txt = fmt(total(m)); colon = true; memOn = sel; for (i = 0; i < 4; i++) stg[i] = i < n ? 1 : 0; }
    else if (st === S.COOK || st === S.PAUSE || (st === S.ERR && errFrom === S.COOK)) {
      var c = stageAt(m, remain);
      memOn = sel;
      for (i = 0; i < 4; i++) stg[i] = i < c ? 1 : (i === c ? (b1 ? 1 : 0) : 0);
      if (st === S.ERR) { txt = ' E0 '; dOn = b2; }
      else { txt = fmt(Math.ceil(remain)); colon = true; if (st === S.PAUSE) dOn = b1; else heat = 'P' + m[c].p + ' (' + (c + 1) + '단계)'; }
    }
    else if (st === S.ERR) { txt = ' E0 '; dOn = b2; memOn = sel; }
    else if (st === S.DONE) { txt = 'End '; dOn = b2; memOn = sel; for (i = 0; i < 4; i++) stg[i] = i < n && b2 ? 1 : 0; }
    else if (st === S.EDIT) {
      var it = curItem(), lk = locked(it.i);
      if (lk) txt = '----';
      else if (it.k === 't') { txt = fmt(draft[it.i].t); colon = true; }
      else txt = 'P' + (draft[it.i].p < 10 ? '  ' : ' ') + draft[it.i].p;
      for (i = 0; i < 4; i++) stg[i] = i === it.i ? (b1 ? 1 : 0) : (!locked(i) && draft[i].t > 0 ? 1 : 0);
      memOn = editM; memVis = b1;
    }
    else if (st === S.RST) { txt = 'rSt '; dOn = b2; }
    for (i = 0; i < 4; i++) {
      var on = MAP[txt.charAt(i)] || '';
      for (var k = 0; k < 7; k++) { var ch = 'abcdefg'.charAt(k); setOn('d' + i + ch, dOn && on.indexOf(ch) >= 0); }
      setOn('sg' + i, stg[i]);
      setOn('ml' + i, i === memOn && memVis);
    }
    setOn('col1', colon && dOn); setOn('col2', colon && dOn);
    setOn('pled', st !== S.OFF && st !== S.RST);
  }
  function renderMem() {
    var tb = $('memTbl'); if (!tb) return; tb.textContent = '';
    mems.forEach(function (m, idx) {
      var tr = document.createElement('tr'), n = used(m);
      if (idx === sel) tr.className = 'sel';
      var cells = ['메뉴 ' + (idx + 1) + (idx === sel ? ' ●' : '')];
      for (var i = 0; i < 4; i++) cells.push(i < n ? clock(m[i].t) + ' · P' + m[i].p : '—');
      cells.push(clock(total(m)));
      cells.forEach(function (c) { var td = document.createElement('td'); td.className = 'mono'; td.textContent = c; tr.appendChild(td); });
      tb.appendChild(tr);
    });
  }

  /* ---------- time ---------- */
  var lastT = performance.now();
  function tick() {
    var now = performance.now(), dt = Math.min(1000, now - lastT); lastT = now;
    if (st === S.COOK) {
      var m = mems[sel], prev = stageAt(m, remain);
      remain -= dt / 1000 * speed;
      if (remain <= 0) { remain = 0; go(S.DONE, '남은 시간 0', 'done'); }
      else { var c = stageAt(m, remain); if (c !== prev) { buzz('click'); log('S2 ' + (prev + 1) + '단계 종료, ' + (c + 1) + '단계 시작'); } }
    } else if (st === S.ERR) {
      auxMs += errFrom === S.COOK ? dt * speed : dt;
      if (errFrom === S.COOK && auxMs >= POT_MS) go(S.READY, '용기 없음 1분 경과 (취사 취소)', 'cancel');
      else if (errFrom !== S.COOK && auxMs >= 5000) go(S.READY, '5초 경과', null);
    } else if (st === S.EDIT) {
      if (!held) auxMs += dt;
      if (auxMs >= EDIT_MS) go(S.READY, '30초 무입력 (저장 안 함)', 'cancel');
    } else if (st === S.RST) {
      if (!held) auxMs += dt;
      if (auxMs >= RST_MS) go(S.OFF, '5초 무입력 (복원 취소)', 'cancel');
    } else if (!held && (st === S.READY || st === S.DONE || st === S.PAUSE)) {
      idleMs += dt * speed; auxMs += dt;
      if (idleMs >= IDLE_MS) { if (st === S.PAUSE) go(S.READY, '10분 무입력 (취사 취소)', 'cancel'); else go(S.OFF, '10분 무입력', null); }
      else if (st === S.PAUSE && auxMs >= 30000) { auxMs = 0; buzz('remind'); log('S3 일시정지 알림  |  ' + BN.remind); }
      else if (st === S.DONE && auxN < 2 && auxMs >= 60000) { auxMs = 0; auxN++; buzz('done'); log('S4 완료 알림 ' + auxN + '회  |  ' + BN.done); }
    }
    render();
  }

  /* ---------- test controls ---------- */
  ['spd1', 'spd10', 'spd60'].forEach(function (id) { $(id).addEventListener('change', function (e) { speed = Number(e.target.value); }); });
  $('snd').addEventListener('change', function (e) { soundOn = e.target.checked; if (!soundOn) tone(buzOn); });
  $('pot').addEventListener('change', function (e) {
    pot = e.target.checked; audioInit();
    if (!pot && st === S.COOK) { errFrom = S.COOK; go(S.ERR, '용기 제거', 'err'); }
    else if (pot && st === S.ERR) { if (errFrom === S.COOK) go(S.COOK, '용기 올림 (자동 재개)', 'start'); else go(S.READY, '용기 올림', 'click'); }
  });
  $('cut').addEventListener('click', function () { if (st !== S.OFF) go(S.OFF, '정전', null); });
  $('rst').addEventListener('click', function () {
    mems = defaults(); persist();
    if (st === S.EDIT) go(S.READY, '출고 레시피로 되돌림', 'cancel'); else { log('출고 레시피로 되돌림 (시험용 버튼)'); renderMem(); }
  });

  buildPanel(); renderMem(); render();
  setInterval(tick, 50);
})();
</script>
</body>
</html>
